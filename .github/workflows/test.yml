name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: chawyehsu/setup-moonup@v1

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: moon version
        run: moon version --all

      - name: Install dependencies
        run: |
          moon update
          moon install

      - name: moon check
        run: moon check --deny-warn

      - name: moon build
        run: moon build

      - name: moon test (native)
        run: moon test --target native --deny-warn

      - name: moon test (JavaScript)
        run: moon test --target js --deny-warn

      - name: moon test (Wasm GC)
        run: moon test --target wasm-gc --deny-warn

      - name: Run CLI application scenarios
        run: |
          moon run --target native cmd/main
          moon run --target native cmd/distributed_kv
          moon run --target native cmd/work_pulling
          moon run --target native cmd/chat_room
          moon run --target native cmd/benchmarks

      - name: moon fmt --check
        run: moon fmt --check
